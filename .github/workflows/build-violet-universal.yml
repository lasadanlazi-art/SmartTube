name: Build Violet Universal APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "smarttubetv/**"
      - "common/**"
      - ".github/workflows/build-violet-universal.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Configure signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
            PASS="$KEY_STORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEYPASS="$KEY_PASSWORD"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="smarttube"
            KEYPASS="$PASS"
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/key.jks" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=SmartTube Violet, OU=SmartTube, O=SmartTube, L=Unknown, ST=Unknown, C=US"
          fi
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=%s\n' \
            "$PASS" "$ALIAS" "$KEYPASS" "$GITHUB_WORKSPACE/key.jks" > keystore.properties

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build universal release APK
        run: ./gradlew --no-daemon clean assembleStstableRelease

      - name: Collect universal APK
        run: |
          mkdir -p dist
          cp smarttubetv/build/outputs/apk/ststable/release/*_universal.apk \
            dist/SmartTube_Violet_universal.apk
          ls -lh dist

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_Violet_universal
          path: dist/SmartTube_Violet_universal.apk
          if-no-files-found: error
